name: Build Hermes macOS DMG

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Hermes toolchain
        uses: ./.github/actions/setup-pm
        with:
          toolchain: all

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build macOS DMG
        working-directory: apps/desktop
        run: npm run dist:mac:dmg

      - name: Show build output
        if: always()
        run: |
          echo "=== Release directory ==="
          find apps/desktop/release -maxdepth 2 -type f -print 2>/dev/null || true

      - name: Upload DMG
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Hermes-macOS-DMG
          path: apps/desktop/release/*.dmg
          if-no-files-found: error

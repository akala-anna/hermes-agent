
name: Build Hermes macOS DMG

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare desktop dependencies
        run: |
          python3 scripts/bundles/desktop.py \
            --commit "$GITHUB_SHA" \
            --variant bundled \
            --prepare-only \
            --work "$RUNNER_TEMP/desktop-job" \
            --cache "$GITHUB_WORKSPACE/.cache/desktop-inputs"

      - name: Diagnose get-windows helper
        if: always()
        run: |
          echo "Checking get-windows installations..."

          find . -path '*/get-windows/package.json' -print

          echo "Checking macOS helper..."

          find . -path '*/get-windows/main' -type f -print

      - name: Build macOS application
        run: |
          python3 scripts/bundles/desktop.py \
            --prepared "$RUNNER_TEMP/desktop-job/prepared.json" \
            --variant bundled

      - name: Upload DMG
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Hermes-macOS-DMG
          path: apps/desktop/release/*.dmg
          if-no-files-found: error

      - name: Upload ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Hermes-macOS-ZIP
          path: apps/desktop/release/*.zip
          if-no-files-found: error
